name: Deploy MkDocs
on:
  push:
    branches:
      - main # Altere para 'master' se essa for a sua branch principal
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          
      - name: Instalar dependências
        run: pip install mkdocs-material pymdown-extensions mkdocs-puml mkdocs-minify-plugin mkdocs-jupyter
        
      - name: Realizar o deploy no GitHub Pages
        run: mkdocs gh-deploy --force